<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>

<body>
<div class="container">
<div class="row">
    <div class="col-sm-4 mx-auto border-1">
        <form action="">
            <div class="mt-3 mb-3">
                <label for="first_name" class="form-lab text-danger">First Name</label>
                <input type="text" class="form-control rounded-0" id="first_name">
            </div>
            <div class="mt-3 mb-3">
                <label for="second_name" class="form-lab text-danger">Second Name</label>
                <input type="text" class="form-control rounded-0" id="Second_Name">
            </div>
            <div class="mt-3 mb-3">
                <label for="email" class="form-lab text-danger">Email</label>
                <input type="text" class="form-control rounded-0" id="Email">
            </div>
            <div class="mt-3 mb-3">
                <label for="password" class="form-lab text-danger">Password</label>
                <input type="text" class="form-control rounded-0" id="Password">
            </div>
            <div class="mt-3 mb-3">
                <label for="edu" class="form-label text-danger">Education level</label>
                <select name="edu" id="edu" class="form-select">
                    <option value="">University</option>
                    <option value="">College</option>
                    <option value="">Polytechnic</option>
                    <option value="">Highschool</option>
                    <option value="">Other</option>
                </select>
            </div>

            <div class="form-check">
                <input type="radio" class="form-check-input" id="radio1" name="gender">Male
                <label class="form-check-label" for="radio1"></label>
            </div>
            <div class="form-check">
                <input type="radio" class="form-check-input" id="radio2" name="gender">Female
                <label class="form-check-label" for="radio2"></label>
            </div>

            <button class="btn btn-dark mt-4 w-100">Register</button>


        </form>
    </div>
</div>
</div>

</body>
</html>
